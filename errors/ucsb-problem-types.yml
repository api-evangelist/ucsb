format: apigee-fault-envelope
rfc9457: false
note: >-
  UCSB fronts every campus API with a Campus API Gateway running on Apigee at api.ucsb.edu
  (DNS: api.ucsb.edu -> ucsb-prod.apigee.net). The domain, the API products and the backend
  web services are UCSB's; the fault envelope on gateway-layer failures is Apigee's default.
  There are TWO distinct error shapes in play and UCSB does not reconcile them, which is the
  one real defect in an otherwise disciplined contract:
    1. Gateway auth faults use {"fault": {"faultstring", "detail": {"errorcode"}}}
    2. Unrouted paths use {"message": "..."}
  Neither is declared in any of the 21 published OpenAPI documents — the specs declare only
  their 200 responses plus, on the Swagger 2.0 ones, a WebApiInvalidModel / SimpleMessageModel
  body for backend validation errors. No RFC 9457 application/problem+json is served at the
  gateway; the two OpenAPI 3.0.1 contracts (CLAS Schedules, Department Chartfield) DO define a
  ProblemDetails schema for the backend service, so the backend is closer to RFC 9457 than the
  edge is.
