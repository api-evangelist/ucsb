gaps:
- No error responses are declared in the OpenAPI documents for the gateway layer, so a generated
  client sees only the 200 contract and will not recognise a fault envelope.
- Missing and invalid credentials are indistinguishable to the caller — both return the identical
  body, which makes key-rotation failures hard to diagnose.
- No RFC 9457 / problem+json at the edge, and no Retry-After or rate-limit headers observed on
  any probed response.
