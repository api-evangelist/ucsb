    url: https://developer.ucsb.edu/documentation
  - type: GettingStarted
    url: https://developer.ucsb.edu/docs/getting-started
  - type: APIReference
    url: https://developer.ucsb.edu/apis/all
  - type: Signup
    url: https://developer.ucsb.edu/user/register
- aid: ucsb:campus-api-gateway
  name: UCSB Campus API Gateway
  description: >-
    The single API front door for the campus, at api.ucsb.edu. Every campus API is published as a proxy
    on it and it enforces the ucsb-api-key application entitlement before a request reaches a backend
    web service. It runs on Apigee (api.ucsb.edu CNAMEs to ucsb-prod.apigee.net) but the domain, the proxies,
    the API products and the backend services are UCSB’s, so this is institution-operated infrastructure
    on a vendor runtime, not a vendor tenancy. Probed live 2026-08-30: an unauthenticated call returns
    401 with an Apigee fault envelope, and the CORS allow-list advertises the whole auth surface — ucsb-api-key,
    ucsb-api-version, ucsb-user-jwt.
  humanURL: https://developer.ucsb.edu/docs/security/overview
  baseURL: https://api.ucsb.edu
  x-operator: institution
  tags:
  - API Gateway
  - Campus
  - Security
  properties:
  - type: Documentation
    url: https://developer.ucsb.edu/docs/security/overview
  - type: Authentication
    url: authentication/ucsb-authentication.yml
  - type: Scopes
    url: scopes/ucsb-scopes.yml
  - type: Errors
    url: errors/ucsb-problem-types.yml
  - type: Rules
    url: rules/ucsb-rules.yml
  - type: Lifecycle
    url: lifecycle/ucsb-lifecycle.yml
  - type: Conformance
    url: conformance/ucsb-conformance.yml
  - type: Vocabulary
    url: vocabulary/ucsb-vocabulary.yml
- aid: ucsb:identity-federation
  name: UCSB Identity Federation (Passport / InCommon)
  description: >-
    UCSB operates its own Shibboleth identity provider, "Passport", at passport.identity.ucsb.edu, registered
    in InCommon as entityID urn:mace:incommon:ucsb.edu. Its SAML 2.0 metadata is machine-readable and
    retrievable without credentials from the InCommon MDQ service — HTTP 200, application/samlmetadata+xml,
    XML-signed, probed 2026-08-30. This is the one institution-operated machine-readable surface UCSB
    has that is not an OpenAPI, and it is the kind of surface this catalog has historically missed for
    universities entirely.
  humanURL: https://passport.identity.ucsb.edu/idp/shibboleth
  baseURL: https://passport.identity.ucsb.edu/idp/shibboleth
  x-operator: institution
  tags:
  - Identity Federation
  - Shibboleth
  - SAML
  - InCommon
  properties:
  - type: IdentityFederation
    url: https://mdq.incommon.org/entities/urn%3Amace%3Aincommon%3Aucsb.edu
  - type: Metadata
    url: https://passport.identity.ucsb.edu/idp/shibboleth
  - type: Conformance
    url: conformance/ucsb-conformance.yml
  x-metadata-url: https://mdq.incommon.org/entities/urn%3Amace%3Aincommon%3Aucsb.edu
  x-audit-note: >-
    A host-based verdict on the InCommon MDQ URL reads "vendor" because other institutions resolve through
    the same federation service. That is the federation, not the operator: the entity described is urn:mace:incommon:ucsb.edu
    and the IdP it points at, passport.identity.ucsb.edu, is UCSB's. baseURL is set to the institution-operated
    IdP so the verdict lands correctly; the MDQ retrieval URL is kept as x-metadata-url and as evidence
    in conformance/ucsb-conformance.yml.
- aid: ucsb:alexandria-digital-research-library
  name: Alexandria Digital Research Library (ADRL)
  description: >-
    UCSB Library's institutional research repository, moved from alexandria.ucsb.edu to digital.library.ucsb.edu
    and served through CloudFront. The host is UCSB's and the front end is UCSB Library's own component
    build (the pages render custom <render-daylight-component> elements, not a hosted vendor UI), so it
    is recorded as institution-operated rather than a vendor tenancy. It publishes NO documented API and
    no OAI-PMH endpoint: /oai-pmh?verb=Identify returns 403 and /search.json returns 404 (probed 2026-08-30).
    The CloudFront edge also bot-challenges some requests, so 403 here is a live surface refusing us,
    not a dead one. Recorded as a surface class UCSB operates, with the honest note that it is not programmable.
  humanURL: https://digital.library.ucsb.edu/
  x-operator: institution
  x-programmable: false
  tags:
  - Research Repository
  - Library
  - Digital Collections
  properties:
  - type: ResearchRepository
    url: https://digital.library.ucsb.edu/
- aid: ucsb:library-discovery
  name: UCSB Library Discovery (Ex Libris Primo VE)
  description: >-
    UCSB Library’s catalog and discovery layer. The host search.library.ucsb.edu is a UCSB CNAME onto
    ucsb.primo.exlibrisgroup.com, and the service resolves to Ex Libris tenancy 01UCSB_INST. The collection,
    the holdings and the tenant are UCSB’s; the contract, the API and the engineering are Ex Libris’.
    TENANT — the relationship is recorded here, the vendor’s generic Alma/Primo specification is deliberately
    NOT saved under this institution.
  humanURL: https://search.library.ucsb.edu/
  baseURL: https://ucsb.primo.exlibrisgroup.com
  x-operator: tenant
  x-vendor: Ex Libris (Clarivate)
  x-tenant-evidence: >-
    DNS: search.library.ucsb.edu CNAME ucsb.primo.exlibrisgroup.com; discovery vid=01UCSB_INST:UCSB
  tags:
  - Library
  - Library Catalog
  - Discovery
  - Vendor Tenant
  properties:
  - type: LibraryCatalog
    url: https://search.library.ucsb.edu/
- aid: ucsb:escholarship
  name: UCSB on eScholarship
  description: >-
    UCSB’s open-access scholarship collection inside eScholarship, the University of California’s systemwide
    repository operated by the California Digital Library. It IS OAI-PMH harvestable (https://escholarship.org/oai?verb=Identify
    returns 200, probed 2026-08-30), but the endpoint is CDL’s and serves every UC campus, so the oai-pmh
    conformance is NOT credited to UCSB. TENANT — UCSB’s content on another operator’s platform.
  humanURL: https://escholarship.org/uc/ucsb
  baseURL: https://escholarship.org/oai
  x-operator: tenant
  x-vendor: California Digital Library (University of California)
  tags:
  - Research Repository
  - Open Access
  - OAI-PMH
  - Vendor Tenant
  properties:
  - type: ResearchRepository
    url: https://escholarship.org/uc/ucsb
  x-audit-note: >-
    A cohort-derived host verdict reads escholarship.org as "vendor" because several UC campuses claim
    it. That is correct about the HOST and is exactly why no eScholarship contract is saved under this
    slug. The entry is retained at x-operator: tenant because the relationship itself is a real institutional
    fact — UCSB's open-access collection lives there — and the pipeline is explicit that a tenant relationship
    must be re-labelled, never deleted, to avoid a misattribution. Nothing here is credited to UCSB: see
    the oai-pmh and datacite entries in conformance/ucsb-conformance.yml, both scored conforms:false with
    operator:tenant.
