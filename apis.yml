aid: ucsb
name: University of California, Santa Barbara
description: 'University of California, Santa Barbara is a public land-grant research university in the
  University of California system and an Association of American Universities member. Unusually for this
  cohort, UCSB runs a real, institution-operated API programme rather than a shelf of vendor contracts:
  a Campus API Gateway at api.ucsb.edu, a developer portal at developer.ucsb.edu cataloging 37 campus
  APIs across Academics, Administration, Dining, Employees, Housing and Students, a written and binding
  API design standard for campus publishers, and 21 downloadable first-party OpenAPI documents — every
  one of which declares a ucsb.edu host, so none of it is misattributed vendor engineering. The programme
  is real but it is closed: portal accounts are approved by hand, 25 of the 37 APIs sit above the Auto-Approved
  tier, and no endpoint is callable without an approved consumer key (an unauthenticated probe returns
  401). UCSB also operates its own Shibboleth identity provider registered in InCommon, whose SAML metadata
  is openly machine-readable, and the Alexandria Digital Research Library, which is institution-run but
  has no API. Its library discovery layer and its open-access scholarship are vendor and UC-system tenancies
  and are recorded as such. There is no open-data portal, no OAuth authorization server, no llms.txt and
  no changelog.'
