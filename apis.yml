x-coverage:
  state: gated
  reason: auth_required
  detail: 'UCSB is one of the genuinely programmable institutions in this cohort, but nothing it publishes
    is callable without a manually approved account. The CONTRACTS are open: 21 first-party OpenAPI documents
    download anonymously from developer.ucsb.edu and every one declares a ucsb.edu host, so the estate
    is fully readable and fully attributable. The ENDPOINTS are not: api.ucsb.edu returns 401 to any request
    without a ucsb-api-key, portal registration is approved by hand, 25 of 37 catalogued APIs sit above
    the Auto-Approved tier, and 16 of the 37 do not expose a contract publicly at all — their portal pages
    return an Access-denied body under HTTP 200. No response bodies, rate-limit headers or live schemas
    could therefore be captured. The gap is authorization, not absence.'
  evidence:
  - url: https://developer.ucsb.edu/apis/all
    status: 200
    note: 37 APIs listed with access classification
  - url: https://developer.ucsb.edu/sites/default/files/openapi/quartercalendar-v1-api.ucsb_.edu_.yaml
    status: 200
    note: first-party OpenAPI, downloads anonymously
  - url: https://api.ucsb.edu/academics/quartercalendar/v1/quarters/current
    status: 401
    note: live gateway; Invalid ApiKey fault, no key issuable without approval
  - url: https://developer.ucsb.edu/content/dining-commons
    status: 200
    note: HTTP 200 but body is "Access denied" — one of 16 APIs with no public contract
  - url: https://developer.ucsb.edu/docs/getting-started
    status: 200
    note: '"an administrator will review your account and will grant new accounts manually"'
  - url: https://mdq.incommon.org/entities/urn%3Amace%3Aincommon%3Aucsb.edu
    status: 200
    note: SAML metadata for UCSB IdP, retrievable without credentials
  - url: https://digital.library.ucsb.edu/oai-pmh?verb=Identify
    status: 403
    note: no OAI-PMH on a UCSB host
  - url: https://developer.ucsb.edu/sites/default/files/openapi/curriculums-v1.out_.api_.yml
    status: 404
    note: superseded v1 contract deleted, still referenced by UCSB own client repo
  - url: https://www.ucsb.edu/llms.txt
    status: 404
  - url: https://developer.ucsb.edu/.well-known/security.txt
    status: 404
  probed: '2026-08-30'
x-enrichment:
  pipeline: pipeline-university
  run: '2026-08-30'
  operator_axis_settled: true
  institution_surfaces: 25
  tenant_surfaces: 2
  vendor_surfaces_rejected: 0
x-hostless-resolution:
  resolved: '2026-08-30'
  count: 19
  verdict: institution
  detail: 'The cohort audit builds host verdicts from servers[] only. 19 of the 21 UCSB contracts are
    Swagger 2.0 and declare their host the Swagger 2.0 way — a top-level `host:` plus `basePath:` — so
    they list as HOSTLESS even though every one of them names a UCSB host explicitly. Judged by what each
    spec says about itself, per the ownership rule: 18 declare host: api.ucsb.edu and 1 (Grad Application
    Verifications) declares host: gradpoint.ucsb.edu. Both are under ucsb.edu. Zero name a vendor host,
    zero carry a vendor info.contact, zero carry a vendor info.title. All 19 are x-operator: institution
    and none is a candidate for removal. A derived servers[] block was tried on the working copies to
    make the host machine-visible, but it made all 19 read as MISBASED against their pristine _original
    parents (which have no servers[] at all), so it was reverted: HOSTLESS is the truthful state here
    and MISBASED would have been a false defect. The durable fix belongs in the audit, which should read
    Swagger 2.0 host+basePath when servers[] is absent.'
  hosts:
    api.ucsb.edu: 18
    gradpoint.ucsb.edu: 1
