apis:
- aid: ucsb:developer-portal
  name: UCSB API Developer Portal
  description: >-
    Central campus API developer portal. Catalogs 37 campus APIs across six categories, renders each published
    contract with Swagger UI, and runs registration, App/consumer-key creation and the API Access Request
    workflow. Accounts are approved manually by an administrator. UCSB operates this itself on Drupal
    10; it is not a vendor developer-portal product.
  humanURL: https://developer.ucsb.edu/
  baseURL: https://developer.ucsb.edu/
  x-operator: institution
  tags:
  - API Portal
  - Developer Portal
  - Campus
  properties:
