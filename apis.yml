x-coverage:
  state: gated
  reason: auth_required
  detail: 'UCSB is one of the genuinely programmable institutions in this cohort, but nothing it publishes
    is callable without a manually approved account. The CONTRACTS are open: 21 first-party OpenAPI documents
    download anonymously from developer.ucsb.edu and every one declares a ucsb.edu host, so the estate
    is fully readable and fully attributable. The ENDPOINTS are not: api.ucsb.edu returns 401 to any request
    without a ucsb-api-key, portal registration is approved by hand, 25 of 37 catalogued APIs sit above
    the Auto-Approved tier, and 16 of the 37 do not expose a contract publicly at all — their portal pages
    return an Access-denied body under HTTP 200. No response bodies, rate-limit headers or live schemas
    could therefore be captured. The gap is authorization, not absence.'
  evidence:
  - url: https://developer.ucsb.edu/apis/all
    status: 200
    note: 37 APIs listed with access classification
