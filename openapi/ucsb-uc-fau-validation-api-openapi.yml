openapi: 3.2.0
info:
  version: 1.0.0
  title: FAU (Functional Accounting Unit) Combination Service Uc Fau…
  description: Validates a FAU combination to determine if the FAU is valid or invalid. If invalid, a message will indicate why.
  termsOfService: ''
  contact:
    name: Christian Montecino - christianmontecino@ucsb.edu
servers:
- url: https://api.ucsb.edu/administration/financial/peoplesoft/fauvalidation/v2
security:
- apiKey: []
tags:
- name: Uc Fau Validation
paths:
  /uc_fau_validation:
    post:
      description: Perform a POST in order to validate an account
      responses:
        '200':
          description: Response - Returns a valid or invalid response based on request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UC_FAU_VALIDATION_REPLY'
        '401':
          description: Unauthorized Error
        '500':
          description: Server Error
      parameters:
      - name: businessunit
        in: query
        required: true
        description: Use UCSB8
        schema:
          type: string
          default: UCSB8
      - name: ledgergoup
        in: query
        required: true
        description: Use ACTUALS for Finanial transactions and APPROP_EXP for Budget
        schema:
          type: string
          default: ACTUALS
      - name: account
        in: query
        required: true
        description: 6 digits reflect campus level account detail rolling up to UCOP Account Group Code; includes functional area
        schema:
          type: string
      - name: fund
        in: query
        description: 5 digits reflect campus level fund detail rolling up to UCOP Fund Group Code
        schema:
          type: string
      - name: sub
        in: query
        description: 1 digit expenditure classification
        schema:
          type: string
      - name: object
        in: query
        description: 4 digits detailed expenditure classification
        schema:
          type: string
      - name: transcode
        in: query
        description: 4 digits used with equity accounts
        schema:
          type: string
      tags:
      - Uc Fau Validation
      summary: Create uc fau validation
      x-summary-source: derived
      operationId: postUcFauValidation
      x-operation-id-source: derived
