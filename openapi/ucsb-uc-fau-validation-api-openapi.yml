          $ref: '#/components/schemas/COMBO_VALID_FLG'
        MESSAGE_SET_NBR:
          $ref: '#/components/schemas/MESSAGE_SET_NBR'
        MESSAGE_NBR:
          $ref: '#/components/schemas/MESSAGE_NBR'
        MESSAGE_TEXT:
          $ref: '#/components/schemas/MESSAGE_TEXT'
        COMBO_TRAN_SRC:
          $ref: '#/components/schemas/COMBO_TRAN_SRC'
      type: object
    SEQNO:
      properties: {}
      type: object
    COMBO_CF_MSG_D:
      properties:
        SEQNO:
          $ref: '#/components/schemas/SEQNO'
        COMBO_VALID_FLG:
          $ref: '#/components/schemas/COMBO_VALID_FLG'
      type: object
    AUDIT_ACTN:
      properties:
        IsChanged:
          type: string
      type: object
    COMBO_TRAN_SRC:
      properties:
        IsChanged:
          type: string
      type: object
    PUBLISH_RULE_ID:
      properties:
        IsChanged:
          type: string
      type: object
    MSG_SEQ_FLG:
      properties:
        IsChanged:
          type: string
      type: object
    LANGUAGE_CD:
      properties:
        IsChanged:
          type: string
      type: object
    UC_FAU_VALIDATION_REPLY:
      properties:
        FieldTypes:
          $ref: '#/components/schemas/FieldTypes'
