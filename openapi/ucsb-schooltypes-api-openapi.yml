openapi: 3.2.0
info:
  version: v1.6
  title: Student Record Code Lookups School Types API
  description: Code Lookups from the Office of the Registrar.
servers:
- url: https://api.ucsb.edu/students
tags:
- name: SchoolTypes
paths:
  /lookups/v1/schooltypes:
    get:
      tags:
      - SchoolTypes
      operationId: /lookups/v1/schooltypes
      parameters:
      - name: ucsb-api-version
        in: header
        description: Specific api version to use.
        required: false
        schema:
          type: string
          default: '1.6'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicSchoolType'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicSchoolType'
      description: Gets the list of school type codes.
      security:
      - ucsb-api-key: []
      summary: /lookups/v1/schooltypes
      x-summary-source: derived
components:
  schemas:
    AcademicSchoolType:
      type: object
      properties:
        schoolTypeCode:
          type: string
        description:
          type: string
  securitySchemes:
    ucsb-api-key:
      name: ucsb-api-key
      in: header
      type: apiKey
