openapi: 3.2.0
info:
  version: v1.6
  title: Student Record Code Lookups Degree Status API
  description: Code Lookups from the Office of the Registrar.
servers:
- url: https://api.ucsb.edu/students
tags:
- name: DegreeStatus
paths:
  /lookups/v1/degreestatus:
    get:
      tags:
      - DegreeStatus
      operationId: /lookups/v1/degreestatus
      parameters:
      - name: ucsb-api-version
        in: header
        description: Specific api version to use.
        required: false
        schema:
          type: string
          default: '1.6'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicDegreeStatus'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicDegreeStatus'
      description: Gets the list of degree status codes.
      security:
      - ucsb-api-key: []
      summary: /lookups/v1/degreestatus
      x-summary-source: derived
components:
  schemas:
    AcademicDegreeStatus:
      type: object
      properties:
        degreeStatusCode:
          type: string
        degreeStatusTranslation:
          type: string
  securitySchemes:
    ucsb-api-key:
      name: ucsb-api-key
      in: header
      type: apiKey
