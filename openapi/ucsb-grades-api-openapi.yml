openapi: 3.2.0
info:
  version: v1.6
  title: Student Record Code Lookups Grades API
  description: Code Lookups from the Office of the Registrar.
servers:
- url: https://api.ucsb.edu/students
tags:
- name: Grades
paths:
  /lookups/v1/grades:
    get:
      tags:
      - Grades
      operationId: /lookups/v1/grades
      parameters:
      - name: ucsb-api-version
        in: header
        description: Specific api version to use.
        required: false
        schema:
          type: string
          default: '1.6'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicGrade'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicGrade'
      description: 'Gets the list of grades.

        (Data Dictionary - Grades)'
      security:
      - ucsb-api-key: []
      summary: /lookups/v1/grades
      x-summary-source: derived
components:
  schemas:
    AcademicGrade:
      type: object
      properties:
        gradeCode:
          type: string
        gradeTranslation:
          type: string
        value:
          format: double
          type: number
        comments:
          type: string
  securitySchemes:
    ucsb-api-key:
      name: ucsb-api-key
      in: header
      type: apiKey
