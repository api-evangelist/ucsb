openapi: 3.2.0
info:
  version: v1.6
  title: Student Record Code Lookups Course Repeats API
  description: Code Lookups from the Office of the Registrar.
servers:
- url: https://api.ucsb.edu/students
tags:
- name: CourseRepeats
paths:
  /lookups/v1/courserepeats:
    get:
      tags:
      - CourseRepeats
      operationId: /lookups/v1/courserepeats
      parameters:
      - name: ucsb-api-version
        in: header
        description: Specific api version to use.
        required: false
        schema:
          type: string
          default: '1.6'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicCourseRepeat'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicCourseRepeat'
      description: 'Gets the list of course repeat codes.

        (Data Dictionary - Course Repeat Codes)'
      security:
      - ucsb-api-key: []
      summary: /lookups/v1/courserepeats
      x-summary-source: derived
components:
  schemas:
    AcademicCourseRepeat:
      type: object
      properties:
        repeatCode:
          type: string
        repeatTranslation:
          type: string
  securitySchemes:
    ucsb-api-key:
      name: ucsb-api-key
      in: header
      type: apiKey
