openapi: 3.2.0
info:
  version: v1.6
  title: Student Record Code Lookups Days API
  description: Code Lookups from the Office of the Registrar.
servers:
- url: https://api.ucsb.edu/students
tags:
- name: Days
paths:
  /lookups/v1/days:
    get:
      tags:
      - Days
      operationId: /lookups/v1/days
      parameters:
      - name: ucsb-api-version
        in: header
        description: Specific api version to use.
        required: false
        schema:
          type: string
          default: '1.6'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicDays'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicDays'
      description: Get DaysCode and daysCode translation
      security:
      - ucsb-api-key: []
      summary: /lookups/v1/days
      x-summary-source: derived
components:
  schemas:
    AcademicDays:
      type: object
      properties:
        dayCode:
          type: string
        dayCodeTranslation:
          type: string
  securitySchemes:
    ucsb-api-key:
      name: ucsb-api-key
      in: header
      type: apiKey
