versioning:
  scheme: uri-path + optional request header
  policy_published: true
  policy_url: https://developer.ucsb.edu/docs/publishers/guidelines-and-standards
  major:
    location: URI path, at the root of each API's own deployment package
    rule: >-
      Set the version at the root of the deployment (/students/v1/{endpoint}), never above it
      (/v1/students/{endpoint}). Versioning is per-API so teams can move independently.
    observed: >-
      info.version across the 21 contracts: v1 (10), v1.0 (2), 1.0.0 (2), 1.0 (1), v1.1 (1),
      v1.6 (1), v2 (3), v3 (1). Six different spellings of a version string is itself a
      governance gap the guidelines do not address.
  minor:
    location: ucsb-api-version request header
    rule: >-
      Optional major.minor, sent as the header 'ucsb-api-version: 1.1'. Backends may honour or
      ignore it.
    observed: >-
      Declared as an operation parameter on 14 of 21 contracts; REQUIRED on only one
      (CLAS Schedules).
  response_negotiation:
    headers: [api-supported-versions, api-selected-version]
    status: documented as optional; not observed on any probed response
  note: >-
    UCSB's versioning discipline is genuinely good for this cohort — it is written down, it is
    per-API rather than estate-wide, and the contracts largely follow it. What is missing is
    the other half of a lifecycle: nothing states how long a major version is supported, what
    notice a consumer gets, or where changes are announced.
