    machine_readable: false
    evidence: >-
      https://developer.ucsb.edu/content/academic-curriculums renders "Deprecated False"
      alongside "Security Auto-Approved". Probed 2026-08-30.
  observed_deprecations:
  - item: Academic Curriculums v1
    status: superseded
    replaced_by: Academic Curriculum v3.0
    evidence: >-
      The Academic Curriculums page lists "Previous Versions: v1" and the current spec is
      curriculums-v3_0_0.yaml. The v1 document (curriculums-v1.out_.api_.yml), still
      referenced by UCSB's own ucsb-mold client repo, now returns HTTP 404 on
      developer.ucsb.edu — a superseded contract was removed rather than archived, so anything
      pinned to it broke silently.
    source: https://github.com/ucsb/ucsb-mold
  - item: Student Basic Student Info v1
    status: superseded
    replaced_by: v2 (students-v2.out_.api__1.yaml)
    evidence: info.version v2 on the currently published contract.
  - item: Student Registrations v1
    status: superseded
    replaced_by: v2 (registrations-v2_0.yaml)
  - item: ClassCode Lookup Service v1
    status: superseded
    replaced_by: v2 (basePath /administration/financial/barc/classcode/v2)
change_communication:
  changelog: false
  release_notes: false
  status_page:
    url: https://status.sa.ucsb.edu/
    operator: institution
    covers: Student Affairs Information Systems, which is where most of these backends live.
    probed: '2026-08-30, HTTP 200'
  support_channel: support@developer.ucsb.edu
  note: >-
    There is no API changelog, no release-notes feed and no RSS on developer.ucsb.edu. A
    consumer learns that a contract changed by re-fetching the YAML.
gaps:
- No published support window or end-of-life policy for a major version.
- No Sunset/Deprecation headers (RFC 8594) on any response.
- Superseded spec files are deleted rather than archived — the v1 curriculums URL 404s while
  UCSB's own published client still points at it.
- No changelog or notification channel; the Deprecated flag is human-readable only and is not
  carried into the OpenAPI documents.
